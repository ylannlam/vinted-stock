name: Plafond quotidien des messages aux likes
on:
  push:
    paths:
      - 'supabase/migrations/*ylavint*.sql'
      - 'supabase/migrations/*vinted_agent.sql'
      - 'tests/ylavint-like-limit.*.sql'
      - '.github/workflows/test-ylavint-like-limit.yml'
  pull_request:
    paths:
      - 'supabase/migrations/*ylavint*.sql'
      - 'supabase/migrations/*vinted_agent.sql'
      - 'tests/ylavint-like-limit.*.sql'
      - '.github/workflows/test-ylavint-like-limit.yml'
permissions:
  contents: read
jobs:
  daily-like-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Vérifier le plafond dans PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/agent_test
        run: >-
          psql --dbname "$TEST_DATABASE_URL" -X --set ON_ERROR_STOP=1
          --file tests/ylavint-like-limit.fixture.sql
          --file supabase/migrations/20261107160000_vinted_agent.sql
          --file tests/ylavint-like-limit.columns.sql
          --file supabase/migrations/20261110181209_ylavint_like_daily_limit.sql
          --file tests/ylavint-like-limit.integration.sql
