name: Tests de la création de profils AdsPower
on:
  push:
    paths:
      - 'supabase/migrations/*adspower_profile_factory.sql'
      - 'tests/adspower-factory.*.sql'
      - 'server/adspower-factory.test.js'
      - 'src/lib/adspowerFactory*.js'
      - 'src/components/AdsPowerFactory.jsx'
      - 'tools/adspower-companion/**'
      - '.github/workflows/test-adspower-factory.yml'
  pull_request:
    paths:
      - 'supabase/migrations/*adspower_profile_factory.sql'
      - 'tests/adspower-factory.*.sql'
      - 'server/adspower-factory.test.js'
      - 'src/lib/adspowerFactory*.js'
      - 'src/components/AdsPowerFactory.jsx'
      - 'tools/adspower-companion/**'
      - '.github/workflows/test-adspower-factory.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: adspower_factory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Vérifier les droits, les doublons et les liaisons dans PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/adspower_factory_test
        run: >-
          psql --dbname "$TEST_DATABASE_URL" -X --set ON_ERROR_STOP=1
          --file tests/adspower-factory.fixture.sql
          --file supabase/migrations/20261105170000_adspower_profile_factory.sql
          --file tests/adspower-factory.integration.sql
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Vérifier le connecteur et les règles du site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test server/adspower-factory.test.js
          cd tools/adspower-companion
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node --test *.test.mjs
