name: Tests de sauvegarde
on:
  push:
    paths:
      - 'tools/sauvegarde/**'
      - '.github/workflows/*sauvegarde*.yml'
  pull_request:
    paths:
      - 'tools/sauvegarde/**'
      - '.github/workflows/*sauvegarde*.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: backup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Tester avec des données fictives
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/backup_test
        run: bash tools/sauvegarde/test.sh
