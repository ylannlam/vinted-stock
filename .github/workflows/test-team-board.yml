name: Tests de l’onglet Alicia
on:
  push:
    paths:
      - 'server/team-board*'
      - 'src/lib/teamBoard*'
      - 'src/components/TeamBoardTab.jsx'
      - 'src/lib/navigation.js'
      - 'supabase/migrations/*team_board.sql'
      - 'tests/team-board.*.sql'
      - '.github/workflows/test-team-board.yml'
  pull_request:
    paths:
      - 'server/team-board*'
      - 'src/lib/teamBoard*'
      - 'src/components/TeamBoardTab.jsx'
      - 'src/lib/navigation.js'
      - 'supabase/migrations/*team_board.sql'
      - 'tests/team-board.*.sql'
      - '.github/workflows/test-team-board.yml'
permissions:
  contents: read
jobs:
  team-board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: team_board_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Vérifier les compteurs et les doublons dans PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/team_board_test
        run: >-
          psql --dbname "$TEST_DATABASE_URL" -X --set ON_ERROR_STOP=1
          --file tests/team-board.fixture.sql
          --file supabase/migrations/20261103112015_publication_history.sql
          --file supabase/migrations/20261103164009_listing_studio.sql
          --file supabase/migrations/20261104173000_team_board.sql
          --file tests/team-board.integration.sql
