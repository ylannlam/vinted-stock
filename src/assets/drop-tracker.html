<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop Vinted – Suivi</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#2a2f3a;--txt:#e8eaf0;--mut:#8b93a5;--acc:#09b1ba;--ok:#2ecc71;--warn:#f5a623;--bad:#ff5c5c;--blue:#5aa9ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header.top h1{margin:0;font-size:20px}
header.top h1 span{color:var(--acc)}
nav{display:flex;gap:6px}
nav button{background:var(--card2);color:var(--mut);border:1px solid var(--line);padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:600}
nav button.on{background:var(--acc);color:#04282b;border-color:var(--acc)}
.tools{display:flex;gap:6px}
main{max-width:1100px;margin:0 auto;padding:20px}
section{display:none}
section.on{display:block}
button,input,select,textarea{font:inherit;color:var(--txt)}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.btn{background:var(--acc);color:#04282b;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.mini{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:1px 7px;font-size:11px;cursor:pointer;margin-left:6px}
.mini:hover{color:var(--txt)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px}
.stat small{color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.acc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mut);border-radius:12px;padding:14px}
.acc.post1{border-left-color:var(--warn)}
.acc.post2{border-left-color:var(--blue)}
.acc.wait{border-left-color:#b78bff}
.acc.ready{border-left-color:var(--ok)}
.acc.blocked{border-left-color:var(--bad);opacity:.8}
.acc header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc h3{margin:0;font-size:17px;word-break:break-all}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--card2)}
.badge.post1{background:#3a2c0f;color:var(--warn)}
.badge.post2{background:#10253d;color:var(--blue)}
.badge.wait{background:#2a1f40;color:#b78bff}
.badge.ready{background:#0f3320;color:var(--ok)}
.badge.blocked{background:#3d1515;color:var(--bad)}
.cd{margin:12px 0;padding:10px 12px;background:var(--card2);border-radius:10px;font-weight:700;font-variant-numeric:tabular-nums}
.cd small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.cd.late{color:var(--bad)}
.cd.done{color:var(--ok)}
dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:5px 8px;font-size:14px}
dt{color:var(--mut)}
dd{margin:0;word-break:break-all}
.acc footer{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-size:12px;font-weight:600}
td.r,th.r{text-align:right}
.out{color:var(--bad)}
.in{color:var(--ok)}
.prog{height:12px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok)}
.cat{display:grid;grid-template-columns:130px 1fr 80px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.cat div.t{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.cat div.t i{display:block;height:100%;background:var(--acc)}
.empty{color:var(--mut);text-align:center;padding:30px}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 12px;font-size:18px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f2 .full{grid-column:1/-1}
.dlgbtn{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--acc);color:#04282b;padding:9px 16px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1}
@media(max-width:560px){.f2{grid-template-columns:1fr}.cat{grid-template-columns:100px 1fr 70px}}
</style>
</head>
<body style="visibility:hidden">

<header class="top">
  <h1>📦 Drop <span>Vinted</span></h1>
  <nav>
    <button data-tab="comptes" class="on">Comptes</button>
    <button data-tab="budget">Budget</button>
  </nav>
  <div class="tools">
    <button class="btn ghost sm" id="exportBtn">⬇ Sauvegarde</button>
    <button class="btn ghost sm" id="importBtn">⬆ Restaurer</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</header>

<main>
<!-- ============ COMPTES ============ -->
<section id="comptes" class="on">
  <div class="stats" id="accStats"></div>
  <div class="bar">
    <select id="accFilter" style="max-width:240px">
      <option value="all">Tous les comptes</option>
      <option value="todo">À faire (poster)</option>
      <option value="wait">En validation</option>
      <option value="ready">Prêts</option>
      <option value="blocked">Bloqués</option>
    </select>
    <button class="btn" id="addAcc">+ Nouveau compte</button>
  </div>
  <div class="grid" id="accGrid"></div>
</section>

<!-- ============ BUDGET ============ -->
<section id="budget">
  <div class="card">
    <div class="form">
      <div><label>Date</label><input type="date" id="bDate"></div>
      <div><label>Type</label>
        <select id="bType"><option value="out">Dépense</option><option value="in">Revenu</option></select></div>
      <div><label>Catégorie (tape ce que tu veux)</label>
        <input id="bCat" list="catList" autocomplete="off" placeholder="Ex : Stock Shein">
        <datalist id="catList"></datalist></div>
      <div style="grid-column:span 2"><label>Libellé</label><input id="bLabel" placeholder="Ex : commande Shein #12"></div>
      <div><label>Montant (€)</label><input id="bAmount" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div><button class="btn" id="bAdd" style="width:100%">Ajouter</button></div>
    </div>
  </div>

  <div class="bar">
    <div style="display:flex;gap:8px;align-items:center">
      <label style="margin:0">Mois</label>
      <input type="month" id="bMonth" style="width:auto">
      <button class="btn ghost sm" id="bAll">Tout afficher</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <label style="margin:0">Budget du mois (€)</label>
      <input type="number" id="bBudget" min="0" step="1" style="width:110px">
    </div>
  </div>

  <div class="stats" id="bStats"></div>
  <div class="card" id="bProg" style="display:none"></div>
  <div class="card"><b>Dépenses par catégorie</b><div id="bCats" style="margin-top:8px"></div></div>
  <div class="card" style="padding:6px 14px">
    <table>
      <thead><tr><th>Date</th><th>Catégorie</th><th>Libellé</th><th class="r">Montant</th><th></th></tr></thead>
      <tbody id="bRows"></tbody>
    </table>
  </div>
</section>
</main>

<!-- ============ DIALOG COMPTE ============ -->
<dialog id="accDlg">
  <form method="dialog" id="accForm">
    <h2 id="accDlgTitle">Nouveau compte</h2>
    <div class="f2">
      <div><label>Pseudo</label><input id="fPseudo" autocomplete="off"></div>
      <div><label>Navigateur utilisé</label>
        <input id="fBrowser" list="browsers" placeholder="Chrome, Safari…">
        <datalist id="browsers"><option>Chrome</option><option>Safari</option><option>Firefox</option><option>Brave</option><option>Edge</option><option>Opera</option><option>Samsung Internet</option><option>DuckDuckGo</option></datalist>
      </div>
      <div><label>Adresse mail</label><input id="fEmail" type="text" autocomplete="off"></div>
      <div><label>Numéro de téléphone</label><input id="fPhone" type="text" autocomplete="off"></div>
      <div><label>Compte créé le</label><input id="fCreated" type="datetime-local"></div>
      <div><label>Étape</label>
        <select id="fStage">
          <option value="post1">Poster la 1ère annonce</option>
          <option value="post2">Poster la 2ème annonce</option>
          <option value="wait">En validation (attente)</option>
          <option value="ready">Compte prêt</option>
          <option value="blocked">Bloqué / suspendu</option>
        </select></div>
      <div class="full"><label>Échéance du compte à rebours (réglable)</label><input id="fNext" type="datetime-local"></div>
      <div class="full"><label>Notes</label><textarea id="fNotes" rows="2" placeholder="Proxy, appareil, remarque…"></textarea></div>
    </div>
    <div class="dlgbtn">
      <button type="button" class="btn ghost" id="accCancel">Annuler</button>
      <button type="button" class="btn" id="accSave">Enregistrer</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
const KEY = 'dropvinted_v1';
const CATS = ['Stock Shein','Comptes Vinted (SIM, mails)','Emballage','Frais de port','Employés','Outils / abonnements','Pub / boost','Autre'];
const STAGES = {
  post1:   {label:'Poster la 1ère annonce', cd:'À poster avant'},
  post2:   {label:'Poster la 2ème annonce', cd:'À poster avant'},
  wait:    {label:'En validation',          cd:'Compte prêt dans'},
  ready:   {label:'Compte prêt ✅',          cd:''},
  blocked: {label:'Bloqué',                 cd:''}
};
const DAY = 24*3600*1000;

/* ---------- données ---------- */
let S = {accounts:[],expenses:[],settings:{budget:0}};
let initialized = false;
function save(){ if(initialized) parent.postMessage({type:'drop-save', payload:S}, '*'); }
window.addEventListener('message', event => {
  if(event.source!==parent || event.data?.type!=='drop-init' || initialized) return;
  S=event.data.payload; initialized=true;
  $('bBudget').value=S.settings.budget || '';
  refreshCats(); renderAccounts(); renderBudget();
  document.body.style.visibility='visible';
});

function ask(message){
  return new Promise(resolve=>{
    const dlg=document.createElement('dialog');
    const p=document.createElement('p'); p.textContent=message;
    const no=document.createElement('button'); no.className='btn ghost';no.textContent='Annuler';
    const yes=document.createElement('button');yes.className='btn';yes.textContent='Confirmer';
    const end=value=>{dlg.close();dlg.remove();resolve(value)};
    no.onclick=()=>end(false);yes.onclick=()=>end(true);
    dlg.oncancel=e=>{e.preventDefault();end(false)};
    dlg.append(p,no,yes);document.body.append(dlg);dlg.showModal();
  });
}
/* ---------- utils ---------- */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const fdt = ts => new Date(ts).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const toLocalInput = ts => new Date(ts - new Date(ts).getTimezoneOffset()*60000).toISOString().slice(0,16);
const fromLocalInput = v => v ? new Date(v).getTime() : null;
const pad = n => String(n).padStart(2,'0');
function fmtDur(ms){
  ms = Math.abs(ms);
  const s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), x = s%60;
  return (d? d+'j ':'') + pad(h)+'h '+pad(m)+'m '+pad(x)+'s';
}
let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800);
}
function copy(v){
  if(!v) return;
  const fallback=()=>{const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();toast('Copié')};
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(()=>toast('Copié'),fallback);
  else fallback();
}

/* ---------- onglets ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.tab));
});

/* ================= COMPTES ================= */
function cdInfo(a){
  const now = Date.now();
  if(a.stage==='ready')   return {cls:'done', main:'Compte prêt ✅', sub:'Tu peux l\'utiliser'};
  if(a.stage==='blocked') return {cls:'late', main:'Compte bloqué', sub:''};
  if(!a.nextAt)           return {cls:'', main:'—', sub:'Aucune échéance réglée'};
  const diff = a.nextAt - now;
  if(a.stage==='wait'){
    return diff>0 ? {cls:'', main:fmtDur(diff), sub:STAGES.wait.cd} : {cls:'done', main:'Compte prêt ✅', sub:''};
  }
  return diff>0
    ? {cls:'', main:fmtDur(diff), sub:STAGES[a.stage].cd}
    : {cls:'late', main:'⚠ À poster maintenant', sub:'En retard de '+fmtDur(diff)};
}
function paintCd(a){
  const el = document.querySelector('[data-cd="'+a.id+'"]');
  if(!el) return;
  const i = cdInfo(a);
  el.className = 'cd '+i.cls;
  el.innerHTML = esc(i.main) + (i.sub? '<small>'+esc(i.sub)+'</small>' : '');
}
function advLabel(stage){
  return {post1:'✓ 1ère annonce postée', post2:'✓ 2ème annonce postée', wait:'Marquer prêt maintenant'}[stage] || '';
}
function accCard(a){
  const st = STAGES[a.stage] || STAGES.post1;
  const row = (k,v,copyable)=> `<dt>${k}</dt><dd>${v?esc(v):'<span style="color:var(--mut)">—</span>'}${copyable&&v?` <button class="mini" data-act="copy" data-v="${esc(v)}">copier</button>`:''}</dd>`;
  return `<article class="acc ${a.stage}">
    <header><h3>${esc(a.pseudo||'(sans pseudo)')}</h3><span class="badge ${a.stage}">${esc(st.label)}</span></header>
    <div class="cd" data-cd="${a.id}"></div>
    <dl>
      ${row('Mail',a.email,true)}
      ${row('Numéro',a.phone,true)}
      ${row('Pseudo',a.pseudo,true)}
      ${row('Navigateur',a.browser,false)}
      <dt>Créé le</dt><dd>${a.createdAt?fdt(a.createdAt):'—'}</dd>
      ${a.notes?`<dt>Notes</dt><dd>${esc(a.notes)}</dd>`:''}
    </dl>
    <footer>
      ${advLabel(a.stage)?`<button class="btn sm" data-act="adv" data-id="${a.id}">${advLabel(a.stage)}</button>`:''}
      <button class="btn ghost sm" data-act="edit" data-id="${a.id}">Régler / modifier</button>
      <button class="btn danger sm" data-act="del" data-id="${a.id}">Suppr.</button>
    </footer>
  </article>`;
}
function renderAccounts(){
  const f = $('accFilter').value;
  const list = S.accounts.filter(a=>{
    if(f==='all') return true;
    if(f==='todo') return a.stage==='post1'||a.stage==='post2';
    return a.stage===f;
  }).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  $('accGrid').innerHTML = list.length ? list.map(accCard).join('') : '<div class="empty" style="grid-column:1/-1">Aucun compte ici. Clique sur « + Nouveau compte ».</div>';
  list.forEach(paintCd);
  const c = k => S.accounts.filter(a=>a.stage===k).length;
  const late = S.accounts.filter(a=>(a.stage==='post1'||a.stage==='post2')&&a.nextAt&&a.nextAt<Date.now()).length;
  $('accStats').innerHTML = `
    <div class="stat"><b>${S.accounts.length}</b><small>comptes au total</small></div>
    <div class="stat"><b style="color:var(--warn)">${c('post1')+c('post2')}</b><small>annonces à poster${late?` (${late} en retard)`:''}</small></div>
    <div class="stat"><b style="color:#b78bff">${c('wait')}</b><small>en validation</small></div>
    <div class="stat"><b style="color:var(--ok)">${c('ready')}</b><small>prêts</small></div>`;
}
$('accFilter').onchange = renderAccounts;

/* actions sur les cartes */
$('accGrid').addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  const act = b.dataset.act, a = S.accounts.find(x=>x.id===b.dataset.id);
  if(act==='copy') return copy(b.dataset.v);
  if(!a) return;
  if(act==='adv'){
    if(a.stage==='post1'){ a.stage='post2'; a.nextAt=Date.now()+DAY; }
    else if(a.stage==='post2'){ a.stage='wait'; a.nextAt=Date.now()+DAY; }
    else if(a.stage==='wait'){ a.stage='ready'; a.nextAt=null; }
    save(); renderAccounts();
  }
  if(act==='edit') openAcc(a.id);
  if(act==='del' && await ask('Supprimer le compte « '+(a.pseudo||'sans pseudo')+' » ?')){
    S.accounts = S.accounts.filter(x=>x.id!==a.id); save(); renderAccounts();
  }
});

/* formulaire compte */
let editId = null;
function openAcc(id){
  editId = id || null;
  const a = id ? S.accounts.find(x=>x.id===id) : null;
  const now = Date.now();
  $('accDlgTitle').textContent = a ? 'Modifier le compte' : 'Nouveau compte';
  $('fPseudo').value  = a?a.pseudo:'';
  $('fEmail').value   = a?a.email:'';
  $('fPhone').value   = a?a.phone:'';
  $('fBrowser').value = a?a.browser:'';
  $('fCreated').value = toLocalInput(a&&a.createdAt?a.createdAt:now);
  $('fStage').value   = a?a.stage:'post1';
  $('fNext').value    = a ? (a.nextAt?toLocalInput(a.nextAt):'') : toLocalInput(now+DAY);
  $('fNotes').value   = a?a.notes:'';
  $('accDlg').showModal();
}
$('addAcc').onclick = ()=>openAcc();
$('accCancel').onclick = ()=>$('accDlg').close();
$('fStage').onchange = ()=>{
  const s = $('fStage').value;
  $('fNext').value = (s==='post1'||s==='post2'||s==='wait') ? toLocalInput(Date.now()+DAY) : '';
};
$('accSave').onclick = ()=>{
  const data = {
    pseudo: $('fPseudo').value.trim(),
    email: $('fEmail').value.trim(),
    phone: $('fPhone').value.trim(),
    browser: $('fBrowser').value.trim(),
    createdAt: fromLocalInput($('fCreated').value) || Date.now(),
    stage: $('fStage').value,
    nextAt: fromLocalInput($('fNext').value),
    notes: $('fNotes').value.trim()
  };
  if(data.stage==='ready'||data.stage==='blocked') data.nextAt = null;
  if(!data.pseudo && !data.email){ toast('Mets au moins un pseudo ou un mail'); return; }
  if(editId){ Object.assign(S.accounts.find(x=>x.id===editId), data); }
  else { S.accounts.push(Object.assign({id:uid()}, data)); }
  save(); $('accDlg').close(); renderAccounts();
};

/* tic-tac chaque seconde */
setInterval(()=>{
  if(!initialized) return;
  let changed=false;
  S.accounts.forEach(a=>{
    if(a.stage==='wait' && a.nextAt && a.nextAt<=Date.now()){ a.stage='ready'; a.nextAt=null; changed=true; }
  });
  if(changed){ save(); renderAccounts(); return; }
  S.accounts.forEach(paintCd);
},1000);

/* ================= BUDGET ================= */
/* suggestions = tes catégories déjà utilisées + quelques exemples ; tu peux écrire n'importe quoi */
function refreshCats(){
  const seen = new Set(), list = [];
  S.expenses.map(x=>x.cat).concat(CATS).forEach(c=>{
    const k = (c||'').trim().toLowerCase();
    if(k && !seen.has(k)){ seen.add(k); list.push(c.trim()); }
  });
  $('catList').innerHTML = list.map(c=>`<option value="${esc(c)}"></option>`).join('');
}
function normCat(v){
  v = v.trim();
  if(!v) return 'Sans catégorie';
  const ex = S.expenses.find(x=>(x.cat||'').trim().toLowerCase()===v.toLowerCase());
  return ex ? ex.cat : v;   // réutilise l'écriture existante pour ne pas dupliquer (ex : "stock shein" = "Stock Shein")
}
refreshCats();
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
$('bDate').value = todayStr();
$('bMonth').value = todayStr().slice(0,7);
$('bBudget').value = S.settings.budget || '';

$('bAdd').onclick = ()=>{
  const amount = parseFloat($('bAmount').value);
  if(!(amount>0)){ toast('Entre un montant'); return; }
  S.expenses.push({
    id:uid(), date:$('bDate').value||todayStr(), type:$('bType').value,
    cat:normCat($('bCat').value), label:$('bLabel').value.trim(), amount:amount
  });
  $('bLabel').value=''; $('bAmount').value=''; $('bCat').value='';
  save(); refreshCats(); renderBudget(); toast('Ajouté');
};
$('bMonth').onchange = renderBudget;
$('bAll').onclick = ()=>{ $('bMonth').value=''; renderBudget(); };
$('bBudget').oninput = ()=>{ S.settings.budget = parseFloat($('bBudget').value)||0; save(); renderBudget(); };
$('bRows').addEventListener('click', async e=>{
  const b = e.target.closest('button[data-del]'); if(!b) return;
  if(await ask('Supprimer cette ligne ?')){ S.expenses = S.expenses.filter(x=>x.id!==b.dataset.del); save(); refreshCats(); renderBudget(); }
});

function renderBudget(){
  const m = $('bMonth').value;
  const items = S.expenses.filter(x=>!m || x.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date));
  const out = items.filter(x=>x.type==='out').reduce((s,x)=>s+x.amount,0);
  const inn = items.filter(x=>x.type==='in').reduce((s,x)=>s+x.amount,0);
  const net = inn-out;
  $('bStats').innerHTML = `
    <div class="stat"><b class="out">${eur(out)}</b><small>dépenses</small></div>
    <div class="stat"><b class="in">${eur(inn)}</b><small>revenus</small></div>
    <div class="stat"><b style="color:${net>=0?'var(--ok)':'var(--bad)'}">${eur(net)}</b><small>solde (revenus − dépenses)</small></div>`;

  const bud = S.settings.budget||0;
  const pg = $('bProg');
  if(bud>0 && m){
    const pct = Math.min(100, out/bud*100);
    const col = out>bud?'var(--bad)':pct>80?'var(--warn)':'var(--ok)';
    pg.style.display='block';
    pg.innerHTML = `<b>Budget du mois : ${eur(out)} / ${eur(bud)}</b> <span style="color:var(--mut)">— ${out>bud?'dépassé de '+eur(out-bud):'reste '+eur(bud-out)}</span><div class="prog"><i style="width:${pct}%;background:${col}"></i></div>`;
  } else pg.style.display='none';

  const byCat = Object.create(null);
  items.filter(x=>x.type==='out').forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+x.amount);
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  $('bCats').innerHTML = cats.length ? cats.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><div class="t"><i style="width:${out?v/out*100:0}%"></i></div><span style="text-align:right">${eur(v)}</span></div>`).join('') : '<span style="color:var(--mut)">Aucune dépense sur cette période.</span>';

  $('bRows').innerHTML = items.length ? items.map(x=>`<tr>
    <td>${new Date(x.date).toLocaleDateString('fr-FR')}</td>
    <td>${esc(x.cat)}</td>
    <td>${esc(x.label)}</td>
    <td class="r ${x.type}">${x.type==='out'?'−':'+'}${eur(x.amount)}</td>
    <td class="r"><button class="mini" data-del="${x.id}">✕</button></td></tr>`).join('')
    : '<tr><td colspan="5" class="empty">Aucune ligne.</td></tr>';
}

/* ================= SAUVEGARDE ================= */
$('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'drop-vinted-sauvegarde-'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
};
$('importBtn').onclick = ()=>$('importFile').click();
$('importFile').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const d = validateTracker(JSON.parse(r.result));
      if(!Array.isArray(d.accounts)||!Array.isArray(d.expenses)) throw 0;
      if(!(await ask('Remplacer les données actuelles par cette sauvegarde ?'))) return;
      S = Object.assign({accounts:[],expenses:[],settings:{budget:0}}, d);
      save(); $('bBudget').value = S.settings.budget||''; refreshCats(); renderAccounts(); renderBudget(); toast('Sauvegarde restaurée');
    }catch(err){ toast('Fichier invalide : vérifiez le contenu de la sauvegarde.'); }
  };
  r.readAsText(f); e.target.value='';
};

renderAccounts();
renderBudget();
</script>
</body>
</html>
